          --bg:#e8ecf1; --panel:#ffffff; --header:#2a5db0; --title:#1a3a6b;

          --radius:10px; --font: system-ui, -apple-system, sans-serif; --cover: linear-gradient(120deg,#dbeafe,#fef3c7);
        }
        /* 8 TEMAS OFICIAIS - transformam TUDO via vars - sem base64 */
        .tema-original{ --bg:#e6edf5; --panel:#ffffff; --header:#2a5db0; --title:#14325f; --btn:#2a5db0; --line:#c2d0e3; --accent:#ff7a00; --text:#1e293b; --radius:10px; --font: system-ui, sans-serif; --cover: linear-gradient(110deg,#bfdbfe 0%,#fef3c7 100%); }
        .tema-hardrock{ --bg:#0a0a0a; --panel:#171717; --header:#000000; --title:#ff2222; --btn:#ff1a1a; --line:#2a2a2a; --accent:#ff1a1a; --text:#ededed; --radius:2px; --font: Impact, sans-serif; --cover: linear-gradient(90deg,#000 0%,#3a0000 100%); }
        .tema-primaveril{ --bg:#ecfdf5; --panel:#ffffff; --header:#16a34a; --title:#166534; --btn:#22c55e; --line:#a7f3d0; --accent:#f472b6; --text:#14532d; --radius:22px; --font: Georgia, serif; --cover: linear-gradient(120deg,#dcfce7 0%,#fef9c3 60%,#fbcfe8 100%); }
        .tema-romantico{ --bg:#fff1f2; --panel:#ffffff; --header:#be123c; --title:#881337; --btn:#e11d48; --line:#fecdd3; --accent:#fb7185; --text:#4c0519; --radius:28px; --font: 'Palatino Linotype', Palatino, serif; --cover: linear-gradient(120deg,#ffe4e6 0%,#fce7f3 100%); }
        .tema-darkzombie{ --bg:#0d160d; --panel:#1a2a1a; --header:#071007; --title:#a3e635; --btn:#65a30d; --line:#2d422d; --accent:#84cc16; --text:#d9f99d; --radius:4px; --font: 'Courier New', monospace; --cover: linear-gradient(180deg,#122612 0%,#1a1a0a 100%); }
        .tema-anos50{ --bg:#fffbeb; --panel:#ffffff; --header:#0e7490; --title:#164e63; --btn:#0891b2; --line:#fde68a; --accent:#f59e0b; --text:#451a03; --radius:14px; --font: 'Trebuchet MS', Futura, sans-serif; --cover: linear-gradient(90deg,#fef3c7 0%,#a5f3fc 100%); }
        .tema-anos60{ --bg:#fef9c3; --panel:#ffffe0; --header:#7c3aed; --title:#4c1d95; --btn:#a855f7; --line:#e9d5ff; --accent:#facc15; --text:#3b0764; --radius:0px; --font: 'Arial Black', sans-serif; --cover: repeating-linear-gradient(45deg,#facc15 0 12px,#a855f7 12px 24px,#22d3ee 24px 36px); }
        .tema-sertanejo{ --bg:#fdf6e3; --panel:#fffaf0; --header:#78350f; --title:#451a03; --btn:#92400e; --line:#d6c7a8; --accent:#b45309; --text:#3f2a14; --radius:6px; --font: Rockwell, Georgia, serif; --cover: linear-gradient(120deg,#fef3c7 0%,#d6a66a 100%); }

        *{ box-sizing:border-box; }
        html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font); transition: background .5s ease, color .5s ease; }
        .app-root{ min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--font); transition: all .5s ease; padding-top: var(--safe-area-inset-top, 0px); }

        /* header */
        .header-socialbr{
          background:var(--header);
          color:white;
          position:sticky; top:0; z-index:20;
          border-bottom:2px solid var(--line);
          transition: all .5s ease;
        }
        .header-inner{ max-width:1240px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; gap:12px; }
        .logo{ font-weight:800; letter-spacing:-0.03em; font-size:22px; display:flex; align-items:center; gap:8px; }
        .logo b{ background:var(--panel); color:var(--title); padding:2px 8px; border-radius:var(--radius); transition: all .5s ease; }
        .logo i{ font-style:normal; opacity:.9; }
        .nav-top{ display:flex; gap:6px; flex-wrap:wrap; }
        .nav-top span{ padding:6px 10px; border-radius:var(--radius); background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.15); font-size:12px; cursor:pointer; transition: all .5s ease; }
        .nav-top span:hover{ background:var(--panel); color:var(--title); }

        /* estrutura pedida */
        .conteudo-principal{
          max-width:1240px; margin:18px auto; display:grid; grid-template-columns:280px 1fr 300px; gap:16px; padding:0 14px 40px;
        }
        @media(max-width:980px){ .conteudo-principal{ grid-template-columns:1fr; } }

        .bloco-painel{
          background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
          overflow:hidden; transition: all .5s ease; box-shadow: 0 2px 0 var(--line);
        }
        .capa{
          height:96px; background:var(--cover); border-bottom:1px solid var(--line); transition: all .5s ease; position:relative;
        }
        .capa:after{
          content:''; position:absolute; inset:0; background: linear-gradient(0deg, rgba(0,0,0,.15), transparent);
        }
        .titulo-bloco{
          font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:.08em;
          color:var(--title); padding:12px 14px; border-bottom:1px solid var(--line);
          background: color-mix(in srgb, var(--panel) 85%, var(--bg));
          transition: all .5s ease; font-family:var(--font);
        }
        .conteudo-bloco{ padding:12px 14px; }
        .btn-principal{
          background:var(--btn); color:white; border:1px solid var(--line); border-radius:var(--radius);
          padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer; width:100%;
          transition: all .5s ease; font-family:var(--font);
        }
        .btn-principal:hover{ filter:brightness(1.1); transform: translateY(-1px); }
        .sub-aba{
          display:flex; gap:6px; padding:8px; background: var(--bg); border-bottom:1px solid var(--line);
          transition: all .5s ease; flex-wrap:wrap;
        }
